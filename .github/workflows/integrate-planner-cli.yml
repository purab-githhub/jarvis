name: Integrate planner CLI

on:
  push:
    paths:
      - '.github/workflows/integrate-planner-cli.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Integrate planner commands into main.py
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('main.py')
          text = path.read_text()

          if 'from planner_commands import (' not in text:
              marker = 'from notes import add_note, get_note, search_notes, view_notes\n'
              block = marker + (
                  'from planner_commands import (\n'
                  '    run_conflicts_command,\n'
                  '    run_effort_command,\n'
                  '    run_insights_command,\n'
                  '    run_planner_command,\n'
                  '    run_week_command,\n'
                  ')\n'
              )
              if marker not in text:
                  raise SystemExit('Could not find import insertion point')
              text = text.replace(marker, block, 1)

          old_help = '  complete <id>\n  help\n  exit\n'
          new_help = (
              '  complete <id>\n'
              '  week                  Show the Monday-Sunday planner\n'
              '  insights              Show priorities and planning conflicts\n'
              '  effort                Show estimated workload and capacity\n'
              '  conflicts             Show duration-aware schedule conflicts\n'
              '  planner               Show the complete planning analysis\n'
              '  help\n  exit\n'
          )
          if old_help in text and '  planner               Show the complete planning analysis' not in text:
              text = text.replace(old_help, new_help, 1)

          old_banner = '        JARVIS STUDENT v0.11'
          if old_banner in text:
              text = text.replace(old_banner, '        JARVIS STUDENT v0.21', 1)

          old_dispatch = '        elif action == "help":\n            show_help()\n'
          new_dispatch = (
              '        elif action == "week":\n'
              '            run_week_command()\n'
              '        elif action == "insights":\n'
              '            run_insights_command()\n'
              '        elif action == "effort":\n'
              '            run_effort_command()\n'
              '        elif action == "conflicts":\n'
              '            run_conflicts_command()\n'
              '        elif action == "planner":\n'
              '            run_planner_command()\n'
              '        elif action == "help":\n'
              '            show_help()\n'
          )
          if old_dispatch in text and 'elif action == "planner"' not in text:
              text = text.replace(old_dispatch, new_dispatch, 1)

          path.write_text(text)
          PY

      - name: Commit integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add main.py
          if git diff --cached --quiet; then
            echo 'Planner CLI integration already present.'
          else
            git commit -m 'Integrate planner commands into JARVIS CLI'
            git push
          fi
